name: Build catalog site

# A dedicated status check just for the site build — intentionally NOT mixed
# with "Validate marketplace" (the harness/marketplace checks in validate.yml).
# Build only (index + Vite), no deploy. Deployment is handled by pages.yml on push to main.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'plugins/**'
      - 'scripts/build-index.mjs'
      - 'site/**'
      - '.github/workflows/site-build.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install deps
        working-directory: site
        run: npm ci

      - name: Build index from plugins/**
        run: node scripts/build-index.mjs

      - name: Vite build (no deploy)
        working-directory: site
        run: npm run build
