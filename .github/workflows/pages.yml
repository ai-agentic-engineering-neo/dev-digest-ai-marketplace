name: Deploy catalog site to Pages

# Deploy to GitHub Pages: build the index from plugins/** + Vite build → site/dist,
# then publish dist. Reindexing is automatic on every relevant push to main.

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'scripts/build-index.mjs'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One active deployment at a time; new pushes don't cancel an in-progress release.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install deps
        working-directory: site
        run: npm ci

      - name: Build index from plugins/**
        run: node scripts/build-index.mjs

      - name: Vite build
        working-directory: site
        run: npm run build

      - uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
